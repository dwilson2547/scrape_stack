[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwilson-webcache-client"
version = "1.0.1"
description = "Python client for the WebCache REST API"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[tool.setuptools]
py-modules = ["webcache_client"]
