services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: request_auth
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test"]
      interval: 3s
      timeout: 2s
      retries: 10

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    ports:
      - "9000:9000"
      - "9003:9003"
    environment:
      DATABASE_URL: postgresql://test:test@postgres:5432/request_auth?sslmode=disable
      GRPC_ADDR: :9000
      STATUS_ADDR: :9003
      ROBOTS_TXT_SCHEME: http
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9003 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s

  api:
    build:
      context: ../../api
    ports:
      - "9001:8000"
    environment:
      DATABASE_URL: postgresql://test:test@postgres:5432/request_auth
      GRPC_STATUS_URL: http://server:9003/status
    depends_on:
      server:
        condition: service_healthy

  http-test-service:
    build:
      context: ../../../http-test-service
    ports:
      - "9004:9004"
    volumes:
      - ./http_test_service.yaml:/app/config.yaml:ro
    environment:
      CONFIG_PATH: /app/config.yaml
