services:
  imgcache:
    image: dwilson2547/imgcache:latest
    build: .
    ports:
      - "8010:8010"
    environment:
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/data
      - DATABASE_URL=sqlite:////data/imgcache.db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317
      - OTEL_SERVICE_NAME=imgcache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
