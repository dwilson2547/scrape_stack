[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwilson-imgcache-client"
version = "0.3.0"
description = "Python client for the imgcache REST API"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[tool.setuptools]
py-modules = ["imgcache_client"]
