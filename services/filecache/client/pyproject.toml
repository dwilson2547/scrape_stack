[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwilson-filecache-client"
version = "1.0.0"
description = "Python client for the filecache service"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0"]

[tool.setuptools]
py-modules = ["filecache_client"]
