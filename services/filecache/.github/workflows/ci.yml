name: filecache-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.filter.outputs.service }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            service:
              - 'app/**'
              - 'tests/**'
              - 'requirements*.txt'
              - 'Dockerfile'
              - 'main.py'
              - 'config.yaml'
              - 'docker-config.yaml'
              - '.github/workflows/**'

  pr-tests:
    if: github.event_name == 'pull_request' && needs.changes.outputs.service == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f Dockerfile -t filecache:ci .

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.service == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "date_tag=$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/filecache:${{ steps.tags.outputs.sha_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/filecache:${{ steps.tags.outputs.date_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/filecache:latest
