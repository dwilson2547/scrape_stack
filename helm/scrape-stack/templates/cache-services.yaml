apiVersion: apps/v1
kind: Deployment
metadata:
  name: imgcache
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    app: imgcache
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imgcache
  template:
    metadata:
      labels:
        app: imgcache
        {{- include "scrape-stack.labels" . | nindent 8 }}
    spec:
      containers:
        - name: imgcache
          image: {{ .Values.images.imgcache }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 8010
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/imgcache"
            - name: CONFIG_PATH
              value: /etc/imgcache/config.yaml
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: imgcache
          volumeMounts:
            - name: data
              mountPath: /data/imgcache
            - name: config
              mountPath: /etc/imgcache
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: imgcache-data
        - name: config
          configMap:
            name: imgcache-config
