apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webcache-data
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    app: webcache
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.persistence.webcache.storageClassName }}
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.persistence.webcache.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webcache
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    app: webcache
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webcache
  template:
    metadata:
      labels:
        app: webcache
        {{- include "scrape-stack.labels" . | nindent 8 }}
    spec:
      containers:
        - name: webcache
          image: {{ .Values.images.webcache }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: STORAGE_BACKEND
              value: local
            - name: LOCAL_STORAGE_PATH
              value: /data/webcache
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/webcache"
            - name: BROWSERLESS_URL
              value: "http://browserless:3000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
            - name: OTEL_SERVICE_NAME
              value: webcache
          volumeMounts:
            - name: data
              mountPath: /data/webcache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: webcache-data
---
apiVersion: v1
kind: Service
metadata:
  name: webcache
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    app: webcache
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: webcache
  ports:
    - port: 8000
      targetPort: 8000
---
