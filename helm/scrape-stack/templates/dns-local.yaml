{{- if .Values.dnsLocal.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-local-config
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    app: coredns-local
    {{- include "scrape-stack.labels" . | nindent 4 }}
data:
  Corefile: |
    {{ .Values.domains.stack }}:53 {
        file /etc/coredns/db.{{ .Values.domains.stack }}
        log
        errors
    }

    {{ .Values.domains.monitoring }}:53 {
        file /etc/coredns/db.{{ .Values.domains.monitoring }}
        log
        errors
    }

    .:53 {
        forward . 8.8.8.8 1.1.1.1
        cache 30
        log
        errors
        health :8080
        ready :8181
    }

  {{ printf "db.%s" .Values.domains.stack }}: |
    $ORIGIN {{ .Values.domains.stack }}.
    $TTL 300

    @   IN  SOA  ns1.{{ .Values.domains.stack }}. admin.{{ .Values.domains.stack }}. (
                    2026051002 ; serial
                    3600       ; refresh
                    900        ; retry
                    86400      ; expire
                    300        ; minimum TTL
                 )

    @   IN  NS   ns1.{{ .Values.domains.stack }}.
    ns1 IN  A    {{ .Values.dnsLocal.loadBalancerIP }}

    @   IN  A    {{ .Values.dnsLocal.ingressIP }}
    *   IN  A    {{ .Values.dnsLocal.ingressIP }}
{{- range $name, $prefix := .Values.ingress.prefixes }}
    {{ $prefix }}  IN  A  {{ $.Values.dnsLocal.ingressIP }}
{{- end }}

{{- if .Values.requestAuth.externalGrpc.enabled }}
    {{ .Values.requestAuth.externalGrpc.dnsPrefix }}  IN  A  {{ .Values.requestAuth.externalGrpc.loadBalancerIP }}
{{- end }}

  {{ printf "db.%s" .Values.domains.monitoring }}: |
    $ORIGIN {{ .Values.domains.monitoring }}.
    $TTL 300

    @   IN  SOA  ns1.{{ .Values.domains.stack }}. admin.{{ .Values.domains.stack }}. (
                    2026051002 ; serial
                    3600       ; refresh
                    900        ; retry
                    86400      ; expire
                    300        ; minimum TTL
                 )

    @   IN  NS   ns1.{{ .Values.domains.stack }}.

    @   IN  A    {{ .Values.dnsLocal.ingressIP }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-local
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    app: coredns-local
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coredns-local
  template:
    metadata:
      labels:
        app: coredns-local
        {{- include "scrape-stack.labels" . | nindent 8 }}
    spec:
      containers:
        - name: coredns
          image: {{ .Values.dnsLocal.image }}
          imagePullPolicy: {{ .Values.dnsLocal.imagePullPolicy }}
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: coredns-local-config
---
apiVersion: v1
kind: Service
metadata:
  name: coredns-local
  namespace: {{ include "scrape-stack.namespace" . }}
  annotations:
    metallb.universe.tf/loadBalancerIPs: {{ .Values.dnsLocal.loadBalancerIP | quote }}
  labels:
    app: coredns-local
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    app: coredns-local
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
{{- end }}
