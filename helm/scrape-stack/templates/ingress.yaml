---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cache-browser-ui
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ include "scrape-stack.fqdn" (dict "prefix" .Values.ingress.prefixes.cacheBrowserUi "domain" $stackDomain) }}
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: cache-browser-api
                port:
                  number: 8040
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cache-browser-ui
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cache-browser-api
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ include "scrape-stack.fqdn" (dict "prefix" .Values.ingress.prefixes.cacheBrowserApi "domain" $stackDomain) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cache-browser-api
                port:
                  number: 8040
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cache-browser-proxy
  namespace: {{ include "scrape-stack.namespace" . }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  labels:
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ include "scrape-stack.fqdn" (dict "prefix" .Values.ingress.prefixes.cacheBrowserUi "domain" $stackDomain) }}
      http:
        paths:
          - path: /proxy/web(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: webcache
                port:
                  number: 8000
          - path: /proxy/image(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: imgcache
                port:
                  number: 8010
          - path: /proxy/video(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: vidcache
                port:
                  number: 8020
          - path: /proxy/file(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: filecache
                port:
                  number: 8030
{{- end }}
