{{- if .Values.ingress.enabled }}
{{- $stackDomain := .Values.domains.stack }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webcache
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ include "scrape-stack.fqdn" (dict "prefix" .Values.ingress.prefixes.webcache "domain" $stackDomain) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webcache
                port:
                  number: 8000
---
