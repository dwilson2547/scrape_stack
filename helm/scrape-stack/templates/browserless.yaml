apiVersion: apps/v1
kind: Deployment
metadata:
  name: browserless
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    app: browserless
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browserless
  template:
    metadata:
      labels:
        app: browserless
        {{- include "scrape-stack.labels" . | nindent 8 }}
    spec:
      containers:
        - name: browserless
          image: {{ .Values.images.browserless }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: MAX_CONCURRENT_SESSIONS
              value: "5"
            - name: CONNECTION_TIMEOUT
              value: "60000"
---
apiVersion: v1
kind: Service
metadata:
  name: browserless
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    app: browserless
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: browserless
  ports:
    - port: 3000
      targetPort: 3000
