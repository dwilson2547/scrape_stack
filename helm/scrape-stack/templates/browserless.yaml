apiVersion: apps/v1
kind: Deployment
metadata:
  name: browserless
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    app: browserless
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browserless
  template:
    metadata:
      labels:
        app: browserless
        {{- include "scrape-stack.labels" . | nindent 8 }}
    spec:
      containers:
        - name: browserless
          image: {{ .Values.images.browserless }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 3000
          # Browserless v2 names (v1 was MAX_CONCURRENT_SESSIONS / CONNECTION_TIMEOUT).
          env:
            - name: CONCURRENT
              value: {{ .Values.browserless.maxConcurrentSessions | int | quote }}
            - name: TIMEOUT
              value: {{ .Values.browserless.connectionTimeoutMs | int | quote }}
          readinessProbe:
            httpGet: {path: /active, port: 3000}
            periodSeconds: 10
          {{- with .Values.browserless.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: browserless
  namespace: {{ include "scrape-stack.namespace" . }}
  labels:
    app: browserless
    {{- include "scrape-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: browserless
  ports:
    - port: 3000
      targetPort: 3000
