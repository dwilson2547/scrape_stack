namespace:
  create: true
  name: scrape-stack

domains:
  stack: scrapestack.local
  monitoring: monitoring.local

postgres:
  host: postgres.postgres.svc.cluster.local
  existingSecret: postgres-credentials

images:
  # Browserless 2.57.0 / Chrome 156, pinned by digest (`browserless/chrome:latest` had silently stayed
  # on 1.61.1 / Chrome 121, which Cloudflare blocked).
  browserless: ghcr.io/browserless/chromium@sha256:c4fd6493ff97936eb62cb35bbc19a428dda3d30905c3a59a28d9620f29b85db1
  requestAuthServer: dwilson2547/request-auth-server:latest
  requestAuthApi: dwilson2547/request-auth-api:latest
  requestAuthUi: dwilson2547/request-auth-ui:latest
  webcache: dwilson2547/webcache:latest
  imgcache: dwilson2547/imgcache:latest
  filecache: dwilson2547/filecache:latest
  vidcache: dwilson2547/vidcache:latest
  cacheBrowserApi: dwilson2547/cache-browser-api:latest
  cacheBrowserUi: dwilson2547/cache-browser-ui:latest

imagePullPolicy: Always

persistence:
  webcache:
    storageClassName: nfs-dataset
    size: 250Gi
  imgcache:
    storageClassName: nfs-dataset
    size: 500Gi
  filecache:
    storageClassName: nfs-dataset
    size: 1000Gi
  vidcache:
    storageClassName: nfs-dataset
    size: 1000Gi

requestAuth:
  externalGrpc:
    enabled: true
    dnsPrefix: request-auth-server
    loadBalancerIP: 192.168.0.62

cacheBrowser:
  ui:
    nginxResolver: 10.152.183.10  # Default microk8s DNS resolver IP, adjust if using a different Kubernetes setup

ingress:
  enabled: true
  className: nginx
  prefixes:
    webcache: webcache
    imgcache: imgcache
    vidcache: vidcache
    filecache: filecache
    authUi: auth
    cacheBrowserUi: cache-browser
    cacheBrowserApi: cache-browser-api

monitoring:
  otelCollector:
    httpEndpoint: "http://otel-collector.monitoring.svc.cluster.local:4318"
    grpcEndpoint: "otel-collector.monitoring.svc.cluster.local:4317"

browserless:
  # Shared browser for short work: webcache's /render and token-only scrapers. Scrapers that drive a
  # browser for a whole run bring their own sidecar (gyopart scraping.browserSidecar).
  maxConcurrentSessions: 3
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    # ⚠ unverified sizing for 3 short sessions; without a limit one tab took 6.8 GB of a 32 GB node.
    limits: {memory: 4Gi}
  # Default lifetime of a session in ms, after which browserless closes it. A client can ask for its own
  # with ?timeout=<ms> on the connect URL (long-running scrapers such as the parts-direct updater do).
  connectionTimeoutMs: 3600000
