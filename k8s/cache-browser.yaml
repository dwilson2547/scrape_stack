# ── cache-browser-ui nginx config ─────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: cache-browser-ui-env
  namespace: scrape-stack
data:
  NGINX_RESOLVER: "10.152.183.10"  # kube-dns ClusterIP (MicroK8s)
  API_HOST: "cache-browser-api.scrape-stack.svc.cluster.local"
  API_PORT: "8040"
  WEBCACHE_HOST: "webcache.scrape-stack.svc.cluster.local"
  WEBCACHE_PORT: "8000"
  IMGCACHE_HOST: "imgcache.scrape-stack.svc.cluster.local"
  IMGCACHE_PORT: "8010"
  FILECACHE_HOST: "filecache.scrape-stack.svc.cluster.local"
  FILECACHE_PORT: "8030"
  VIDCACHE_HOST: "vidcache.scrape-stack.svc.cluster.local"
  VIDCACHE_PORT: "8020"
---
# ── cache-browser-api ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-browser-api
  namespace: scrape-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-browser-api
  template:
    metadata:
      labels:
        app: cache-browser-api
    spec:
      containers:
        - name: cache-browser-api
          image: dwilson2547/cache-browser-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8040
          env:
            - name: WEBCACHE_URL
              value: "http://webcache:8000"
            - name: IMGCACHE_URL
              value: "http://imgcache:8010"
            - name: FILECACHE_URL
              value: "http://filecache:8030"
            - name: VIDCACHE_URL
              value: "http://vidcache:8020"
---
apiVersion: v1
kind: Service
metadata:
  name: cache-browser-api
  namespace: scrape-stack
spec:
  selector:
    app: cache-browser-api
  ports:
    - port: 8040
      targetPort: 8040
---
# ── cache-browser-ui ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-browser-ui
  namespace: scrape-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-browser-ui
  template:
    metadata:
      labels:
        app: cache-browser-ui
    spec:
      containers:
        - name: cache-browser-ui
          image: dwilson2547/cache-browser-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: cache-browser-ui-env
---
apiVersion: v1
kind: Service
metadata:
  name: cache-browser-ui
  namespace: scrape-stack
spec:
  selector:
    app: cache-browser-ui
  ports:
    - port: 80
      targetPort: 80
