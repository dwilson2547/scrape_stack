apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webcache
  namespace: scrape-stack
spec:
  ingressClassName: nginx
  rules:
    - host: webcache.scrapestack.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webcache
                port:
                  number: 8000
---
