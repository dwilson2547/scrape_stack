apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: scrape-stack
  labels:
    # Must match the serviceMonitorSelector on your Prometheus CR.
    # With kube-prometheus-stack the default label is release: <helm-release-name>.
    release: prometheus
spec:
  selector:
    matchLabels:
      app: otel-collector
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 15s
