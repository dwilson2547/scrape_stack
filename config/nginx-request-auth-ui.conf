server {
    listen 80;

    # Use Docker's embedded DNS so nginx re-resolves on each request
    # rather than caching the IP at startup (which breaks after rebuilds).
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://request-auth-api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
